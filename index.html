const lin=t=>t,eio=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,eo=t=>1-Math.pow(1-t,3),ei=t=>t*t*t,
      back=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const tweens=new Set();
function tw(to,dur,ease=eio){return new Promise(res=>{
  const from={};for(const k in to)from[k]=P[k];
  tweens.add({from,to,dur,ease,t0:performance.now(),res});});}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.random()*(b-a);
let phase=0,last=performance.now();
function frame(now){
  const dt=Math.min(now-last,50);last=now;
  for(const tw_ of [...tweens]){
    let k=(now-tw_.t0)/tw_.dur;
    if(k>=1){for(const p in tw_.to)P[p]=tw_.to[p];tweens.delete(tw_);tw_.res();}
    else{const e=tw_.ease(Math.max(0,k));for(const p in tw_.to)P[p]=tw_.from[p]+(tw_.to[p]-tw_.from[p])*e;}
  }
  phase+=dt/P.bp*Math.PI*2;
  const bs=Math.sin(phase)*P.ba;
  owl.style.transform=`translate(${P.gx}px,${P.gy}px) rotate(${P.grot}deg) scale(${P.gsx},${P.gsy})`;
  bodyEl.style.transform=`scale(${1-.006*bs},${1+.016*bs})`;
  headEl.style.transform=`translate(${P.hx}px,${P.hy-5*bs}px) rotate(${P.hr+.4*bs}deg)`;
  const c=Math.max(P.lid,P.blink),s=`scaleY(${c})`;
  l1.style.transform=s;l2.style.transform=s;
  if(P.mvis){mouse.style.display='block';
    mouse.style.transform=`translate(${P.mx}px,${P.my}px) rotate(${P.mr}deg) scale(${P.mflip},1)`;}
  else mouse.style.display='none';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

let sleeping=false;
(async function blinker(){while(true){await wait(rnd(2200,5200));
  if(sleeping)continue;
  await tw({blink:1},80,lin);await tw({blink:0},120,lin);
  if(Math.random()<.2){await wait(120);await tw({blink:1},80,lin);await tw({blink:0},120,lin);}
}})();

/* ---------- actions ---------- */
async function lookAround(){
  await tw({hr:-8,hx:-8},520);await wait(700);
  await tw({hr:8,hx:8},800);await wait(800);
  await tw({hr:0,hx:0},520);}
async function tilt(){
  const d=Math.random()<.5?-1:1;
  await tw({hr:11*d,hx:3*d},380,back);await wait(rnd(1200,2200));
  await tw({hr:0,hx:0},400);}
async function peekDown(){
  await tw({hy:20,hr:4},500);await wait(1100);
  await tw({hy:-6},300);await tw({hy:0,hr:0},300);}
async function ruffle(){
  for(let i=0;i<7;i++){await tw({grot:i%2?-1.8:1.8,gsx:1.025},55,lin);}
  await tw({grot:0,gsx:1},150);}
async function hop(){
  await tw({gsy:.94,gsx:1.04},160);
  await tw({gy:-45,gsy:1.04,gsx:.97},230,eo);
  await tw({gy:0,gsy:.95,gsx:1.04},210,ei);
  await tw({gsy:1,gsx:1},220,eo);}
async function sleepy(){
  sleeping=true;
  await tw({lid:1},1100);
  await wait(300);
  await Promise.all([tw({hy:36,hr:11,gsy:.975,bp:5400,ba:1.5},1600),wait(0)]);
  stage.classList.add('sleeping');
  await wait(rnd(9000,14000));
  stage.classList.remove('sleeping');
  await tw({hy:22},350);                       // дёрнулась во сне
  await Promise.all([tw({hy:0,hr:0,gsy:1,bp:3800,ba:1,lid:0},450,back)]);
  sleeping=false;
  await wait(400);await lookAround();}

async function scurry(toX,{dur=1500,hopH=16}={}){
  const fromX=P.mx;P.mflip=toX<fromX?1:-1;
  const n=Math.max(2,Math.round(dur/190));
  for(let i=0;i<n;i++){
    const x=fromX+(toX-fromX)*(i+1)/n;
    await Promise.all([tw({mx:x},dur/n,lin),
      (async()=>{await tw({my:MY0-hopH,mr:-5},dur/n/2,eo);await tw({my:MY0,mr:3},dur/n/2,ei);})()]);
  }
  await tw({mr:0},100);}
async function mouseJump(h=110,dur=420){
  await tw({my:MY0-h,mr:-14},dur/2,eo);await tw({my:MY0,mr:0},dur/2,ei);}
async function mouseWiggle(){
  for(let i=0;i<5;i++)await tw({mr:i%2?-7:7},90,lin);await tw({mr:0},90);}

async function play(){
  P.mx=1400;P.my=MY0;P.mvis=1;P.mflip=1;
  await scurry(780,{dur:1700});               // мышка вбегает
  await Promise.all([tw({lid:0,hr:9,hx:12,hy:16},450),mouseWiggle()]);
  await tilt();
  // подкрадывается: «кошачье» виляние попой
  await tw({gsy:.9,gsx:1.06,grot:2,hy:20,hr:8},500);
  for(let i=0;i<6;i++)await tw({grot:i%2?-2.5:3.5},110,lin);
  // прыжок 1
  await Promise.all([
    (async()=>{await tw({gx:220,gy:-80,grot:6,gsy:1.05,gsx:.97,hy:6,hr:2},300,eo);
               await tw({gy:0,gsy:.9,gsx:1.07,grot:0},190,ei);})(),
    (async()=>{await wait(120);await mouseJump(120,420);await scurry(1050,{dur:700,hopH:22});})()
  ]);
  await tw({gsy:1,gsx:1,hy:12,hr:6,hx:10},350,eo);
  await wait(500);await mouseWiggle();        // дразнится
  // возвращается на место
  await hop();await tw({gx:0},500);
  await tw({gsy:.9,gsx:1.06,grot:2,hy:20,hr:8},400);
  for(let i=0;i<4;i++)await tw({grot:i%2?-2.5:3.5},110,lin);
  // прыжок 2: мышка пробегает перед совой налево
  await Promise.all([
    (async()=>{await tw({gx:140,gy:-70,grot:4,gsy:1.05,gsx:.97},280,eo);
               await tw({gy:0,gsy:.92,gsx:1.06,grot:0},180,ei);})(),
    (async()=>{await wait(100);await mouseJump(90,380);await scurry(-340,{dur:2000,hopH:18});})(),
    (async()=>{await wait(900);await tw({hr:-9,hx:-14,hy:6},1400,eio);})()
  ]);
  P.mvis=0;
  await tw({gsy:1,gsx:1,gx:0},500,eo);
  await wait(400);
  await tw({hr:-11,hx:-4,hy:0},400,back);await wait(1400);   // «а где мышка?»
  await tw({hr:0,hx:0},500);
  P.mvis=0;
}

const idles=[lookAround,tilt,peekDown,ruffle,hop];
let lastAct=null,sinceBig=0;
(async function main(){
  await wait(1500);
  while(true){
    await wait(rnd(1800,4500));
    let act;sinceBig++;
    const r=Math.random();
    if(sinceBig>=3&&r<.35&&lastAct!==play){act=play;sinceBig=0;}
    else if(sinceBig>=3&&r<.6&&lastAct!==sleepy){act=sleepy;sinceBig=0;}
    else{do{act=idles[Math.floor(Math.random()*idles.length)]}while(act===lastAct);}
    lastAct=act;await act();
  }
})();
</script>
